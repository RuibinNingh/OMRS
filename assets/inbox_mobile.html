<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<script type="text/javascript">try{document.documentElement.setAttribute('data-theme',localStorage.getItem('omrs-theme')==='light'?'light':'dark')}catch(e){}</script>
<title>OMRS 收件箱 · 手机上传</title>
<link rel="stylesheet" href="/assets/vendor/fonts/fonts.css?v=20260920-local">
<link rel="stylesheet" href="/assets/app/styles/tokens.css">
<link rel="stylesheet" href="/assets/app/styles/base.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{padding:env(safe-area-inset-top) 16px 32px}
h1{font-size:1.1rem;padding:18px 0 4px;display:flex;justify-content:space-between;align-items:center}
h1 small{font-size:.7rem;color:var(--success);font-weight:400}
.hint{font-size:.74rem;color:var(--fg-3);line-height:1.6;margin:4px 0 16px}
label.up{display:block;background:var(--accent);color:var(--on-accent);border-radius:16px;padding:22px 16px;text-align:center;font-weight:700;font-size:1rem}
label.up small{display:block;font-weight:400;color:var(--on-accent);opacity:.72;font-size:.72rem;margin-top:4px}
input[type=file]{display:none}
.list{margin-top:16px;display:flex;flex-direction:column;gap:8px}
.row{display:flex;justify-content:space-between;align-items:center;background:var(--surface-1);border:1px solid var(--border-1);border-radius:12px;padding:10px 12px;font-size:.8rem}
.row .n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-right:10px}
.ok{color:var(--success)}.err{color:var(--danger)}.busy{color:var(--warning)}.dup{color:var(--fg-3)}
.bar{height:3px;background:var(--surface-2);border-radius:2px;margin-top:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--info);width:0;transition:width .2s}
.foot{margin-top:22px;font-size:.7rem;color:var(--fg-3);line-height:1.6}
</style>
</head>
<body>
<h1>OMRS 收件箱 <small id="st">●</small></h1>
<div class="hint">在这里选截图上传，回电脑「录入题目」页处理即可。手机端不裁剪；相同图片自动合并。</div>
<label class="up">选择截图上传<small>可多选 · 支持整张长截图</small><input type="file" id="f" accept="image/*" multiple></label>
<div class="list" id="list"></div>
<div class="foot">上传的原图保存在 <code>错题/.omrs/inbox/raw/</code>，不会直接进题库。</div>
<script>
const list=document.getElementById('list');const st=document.getElementById('st');
// Session expired (remote PIN): go to the login page and come back to /m afterwards.
let toLogin=false;const goLogin=()=>{if(toLogin)return;toLogin=true;location.assign('/login?next='+encodeURIComponent('/m'))};
fetch('/api/auth/session').then(r=>r.json()).then(s=>{if(!s.remote||!s.authenticated)return;let last=0;const active=()=>{if(Date.now()-last<60000)return;last=Date.now();fetch('/api/auth/activity',{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'}).catch(()=>{})};['pointerdown','keydown','touchstart','wheel','scroll'].forEach(name=>document.addEventListener(name,active,{passive:true,capture:true}))}).catch(()=>{});
fetch('/api/status').then(async r=>{if(r.status===401){st.textContent='● 需要登录';st.className='err';goLogin();return}if(!r.ok)throw new Error('HTTP '+r.status);const s=await r.json();st.textContent='● 已连接 '+(s.version||'')}).catch(()=>{st.textContent='● 未连接';st.className='err'});
document.getElementById('f').addEventListener('change',async e=>{
  const files=[...e.target.files];e.target.value='';
  for(const file of files){
    const row=document.createElement('div');row.className='row';
    const filename=document.createElement('span');filename.className='n';filename.textContent=file.name;const progress=document.createElement('span');progress.className='busy';progress.textContent='上传中';row.append(filename,progress);list.prepend(row);
    const fd=new FormData();fd.append('file',file,file.name);
    try{
      const r=await fetch('/api/inbox/upload',{method:'POST',body:fd});
      if(r.status===401){progress.textContent='✕ 登录已过期，正在跳转登录…';progress.className='err';goLogin();return}
      const j=await r.json();
      if(!r.ok)throw new Error(j.msg||('HTTP '+r.status));
      const s=row.lastElementChild;
      if(j.items&&j.items.length){s.textContent='✓ 已收 '+j.items[0].width+'×'+j.items[0].height;s.className='ok'}
      else if(j.duplicates&&j.duplicates.length){s.textContent='已存在，合并';s.className='dup'}
      else{s.textContent='未接收';s.className='err'}
    }catch(err){row.lastElementChild.textContent='✕ '+err.message;row.lastElementChild.className='err'}
  }
});
</script>
</body>
</html>
