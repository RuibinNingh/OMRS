<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="color-scheme" content="light dark"><title>AI 框选服务</title><link rel="stylesheet" href="assets/panel.css"><script src="assets/panel.js" type="module"></script></head>
<body><div class="layout"><aside class="sidebar"><a class="brand" href="./"><span class="brand-icon" aria-hidden="true">⌗</span><span>AI 框选<span class="brand-sub">服务管理</span></span></a><nav aria-label="管理导航"><button data-page="overview" aria-current="page">服务概览</button><button data-page="test">框选测试</button><button data-page="keys">调用密钥</button><button data-page="history">请求历史</button><button data-page="models">模型管理</button><button data-page="settings">服务设置</button></nav><div class="sidebar-foot"><span class="status-dot"></span>独立推理服务<p>管理面板与检测 API 共用入口</p></div></aside>
<div class="workspace"><header class="topbar"><span>OMRS <span class="slash">/</span> AI 框选服务</span><div><button class="quiet" data-action="refresh">刷新</button><button class="quiet" data-action="logout" id="logout" hidden>退出登录</button></div></header><main><div class="page-heading"><div><p class="eyebrow">AI 框选服务</p><h1 id="page-title">服务概览</h1><p id="page-description">查看服务状态与最近的框选任务。</p></div><span id="connection" class="badge">等待登录</span></div><div id="notice" role="status" aria-live="polite"></div><div id="content"><section class="card empty"><h2>连接你的框选服务</h2><p>管理员登录后可管理模型、调用密钥和请求历史。</p><button class="primary" data-action="login">管理员登录</button></section></div></main></div></div>
<dialog id="login-dialog"><form id="login-form"><div class="dialog-head"><div><p class="eyebrow">管理员</p><h2>登录服务面板</h2></div></div><p class="muted">使用服务首次初始化生成的管理员密码。</p><label for="password">管理员密码</label><input id="password" type="password" autocomplete="current-password" required minlength="8" maxlength="256"><p id="login-error" class="error" role="alert"></p><button class="primary" type="submit">登录</button></form></dialog>
<dialog id="key-dialog"><div class="dialog-head"><h2>创建调用密钥</h2><button class="quiet" data-action="close-key" aria-label="关闭密钥窗口">关闭</button></div><form id="key-form"><label for="key-name">密钥名称</label><input id="key-name" maxlength="80" required placeholder="例如：家里的 OMRS"><p class="muted">每个客户端使用一个密钥，便于追溯与单独吊销。</p><button class="primary" type="submit">生成密钥</button></form><div id="key-secret" hidden><p>完整 Key 仅展示这一次，请复制到 OMRS 设置。</p><label for="created-key">调用 Key</label><input id="created-key" readonly autocomplete="off"><button data-action="copy-key">复制 Key</button></div><p id="key-error" class="error" role="alert"></p></dialog>
<dialog id="detail-dialog" class="detail-dialog"><div class="dialog-head"><h2>框选记录</h2><button class="quiet" data-action="close-detail">关闭</button></div><div id="detail-content"></div></dialog>
</body></html>
